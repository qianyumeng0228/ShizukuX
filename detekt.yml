# P0-6 门禁配置：聚焦「空 catch」与基础安全规则（文档 P0-6 意图：拒绝新增空 catch）。
# 其余规则集显式关闭，避免存量风格违规让 CI 门禁永久红灯（本仓库此前从未在 CI 跑过 detekt）。
potential-bugs:
  active: false
  UnsafeCallOnNullableType:
    active: true

empty-blocks:
  active: true
  EmptyCatchBlock:
    active: true
    allowedExceptionNameRegex: '_|(ignore|ignored|expected)'
  # 其余空块规则（空函数/空 else/空 class 等）多为存量占位实现，非本门禁目标，显式关闭
  EmptyClassBlock:
    active: false
  EmptyDoWhileBlock:
    active: false
  EmptyElseBlock:
    active: false
  EmptyFinallyBlock:
    active: false
  EmptyForBlock:
    active: false
  EmptyFunctionBlock:
    active: false
  EmptyIfBlock:
    active: false
  EmptyInitBlock:
    active: false
  EmptyKtFile:
    active: false
  EmptySecondaryConstructor:
    active: false
  EmptyWhenBlock:
    active: false
  EmptyWhileBlock:
    active: false

complexity:
  active: false
exceptions:
  active: false
formatting:
  active: false
naming:
  active: false
performance:
  active: false
style:
  active: false
coroutines:
  active: false
comments:
  active: false

build:
  maxIssues: 0
