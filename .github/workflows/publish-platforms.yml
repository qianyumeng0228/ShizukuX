name: Publish Release Mirrors (Manual Fallback)

on:
  # Release-time mirroring now runs on the Tencent Cloud worker. This workflow
  # is kept only as a manual fallback for emergency re-publishing.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync, for example v13.7.0.k2018"
        required: true
        type: string
      platforms:
        description: "all, or a comma-separated list: gitee,cnb,jihulab,gitcode"
        required: false
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      commit: ${{ steps.meta.outputs.commit }}
      matrix: ${{ steps.meta.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Resolve tag and platform matrix
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          TAG="${EVENT_TAG:-$INPUT_TAG}"
          if [ -z "$TAG" ]; then
            echo "::error::release tag is empty"
            exit 1
          fi
          COMMIT="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha)"
          MATRIX="$(python .github/scripts/sync_release.py matrix --input "${INPUT_PLATFORMS:-all}")"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "release ${TAG} -> ${COMMIT}"

      - name: Download GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --clobber
          gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isPrerelease,body > release-assets/release-meta.json
          python .github/scripts/sync_release.py prepare \
            --tag "$TAG" \
            --assets release-assets \
            --meta release-assets/release-meta.json \
            --out release-assets/release-manifest.json

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ steps.meta.outputs.tag }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ matrix.platform }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
      JIHULAB_TOKEN: ${{ secrets.JIHULAB_TOKEN }}
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
      GITCODE_TAG_TIMEOUT: "900"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle-${{ needs.prepare.outputs.tag }}
          path: release-assets

      - name: Sync ${{ matrix.platform }}
        run: |
          set -euo pipefail
          python .github/scripts/sync_release.py "${{ matrix.platform }}" \
            --manifest release-assets/release-manifest.json \
            --assets release-assets \
            --commit "${{ needs.prepare.outputs.commit }}"
