name: Sync Release Assets to CDN Mirrors

on:
  release:
    types: [published, updated, edited]
  schedule:
    # Daily cleanup at 00:00 UTC (08:00 Beijing)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload; leave empty for cleanup only"
        required: false
        type: string
      cleanup_only:
        description: "Only delete orphaned COS objects"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cdn-${{ github.event.release.tag_name || inputs.tag || 'cleanup' }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve target
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      upload: ${{ steps.vars.outputs.upload }}
    steps:
      - name: Resolve inputs
        id: vars
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          CLEANUP_ONLY: ${{ inputs.cleanup_only }}
        run: |
          set -euo pipefail
          TAG="${EVENT_TAG:-$INPUT_TAG}"
          if [ -n "$TAG" ] && [ "${CLEANUP_ONLY:-false}" != "true" ]; then
            UPLOAD=true
          else
            UPLOAD=false
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "upload=${UPLOAD}" >> "$GITHUB_OUTPUT"
          echo "upload=${UPLOAD} tag=${TAG}"

  # COS is the slow / China-side leg. It has its own job and its own retries,
  # so a slow or failing COS run cannot delay or block R2.
  cos:
    name: Tencent COS
    needs: prepare
    if: needs.prepare.outputs.upload == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Download all release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p ./assets
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --dir ./assets \
            --clobber

      - name: Install coscmd
        run: python -m pip install --disable-pip-version-check coscmd

      - name: Upload to Tencent COS
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: |
          set -u
          coscmd config \
            -a "$COS_SECRET_ID" \
            -s "$COS_SECRET_KEY" \
            -b "$COS_BUCKET" \
            -r "$COS_REGION"
          failed=0
          for f in ./assets/*; do
            [ -f "$f" ] || continue
            fname="$(basename "$f")"
            ok=0
            for attempt in 1 2; do
              echo "COS upload ${fname} attempt ${attempt}/2"
              if timeout 300 coscmd upload -s "$f" "$fname"; then
                ok=1
                break
              fi
              sleep $((attempt * 10))
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::COS upload failed: ${fname}"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::warning::COS upload incomplete; the COS job will fail"
            exit 1
          fi

  # R2 is global and fast. It runs in parallel with COS and never waits for it.
  r2:
    name: Cloudflare R2
    needs: prepare
    if: needs.prepare.outputs.upload == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download all release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p ./assets
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --dir ./assets \
            --clobber

      - name: Upload to Cloudflare R2
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --acl public-read --follow-symlinks
        env:
          AWS_S3_BUCKET: ${{ secrets.CF_R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_S3_ENDPOINT: https://${{ secrets.CF_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          SOURCE_DIR: ./assets

  # Daily cleanup, or an explicit workflow_dispatch with cleanup_only.
  cleanup:
    name: Clean COS orphans
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.cleanup_only == true)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Cleanup COS orphans
        env:
          GH_TOKEN: ${{ github.token }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check coscmd
          coscmd config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" -b "$COS_BUCKET" -r "$COS_REGION"
          gh release list --repo "${{ github.repository }}" --limit 200 --json tagName -q '.[].tagName' > /tmp/tags.txt
          mkdir -p /tmp/ref
          while read -r tag; do
            [ -n "$tag" ] || continue
            gh release download "$tag" --repo "${{ github.repository }}" --dir /tmp/ref --clobber 2>/dev/null || true
          done < /tmp/tags.txt
          find /tmp/ref -maxdepth 1 -type f -printf '%f\n' 2>/dev/null | sort > /tmp/declared.txt
          coscmd list | grep -oP '[A-Za-z0-9._-]+\.apk$' | sort > /tmp/cos.txt
          comm -23 /tmp/cos.txt /tmp/declared.txt > /tmp/orphans.txt
          while read -r obj; do
            [ -n "$obj" ] || continue
            echo "Deleting orphan: ${obj}"
            coscmd delete "$obj" || true
          done < /tmp/orphans.txt
